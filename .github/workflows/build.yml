name: Build geoip files
on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '0 0 * * 4'
  push:
    branches:
      - main
    paths-ignore:
      - '.gitignore'
      - 'LICENSE*'
      - '*.md'

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
      - name: Check formatting, build, and tests
        run: |
          test -z "$(gofmt -l *.go)"
          go vet ./...
          go test -race ./...
          go build -o geoip .

  build:
    name: Build
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: geoip-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod

      - name: Set variables
        run: |
          tag="$(date -u +%Y%m%d%H%M%S)"
          echo "TAG_NAME=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$tag" >> "$GITHUB_ENV"
        shell: bash

      - name: Prepare data and output directories
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          : "${IPINFO_TOKEN:?IPINFO_TOKEN is required}"
          mkdir -p data output
          curl --fail --location --silent --show-error \
            --connect-timeout 15 --max-time 120 \
            --retry 2 --retry-max-time 360 --max-filesize 536870912 \
            "https://ipinfo.io/data/ipinfo_lite.mmdb?token=${IPINFO_TOKEN}" \
            --output ./data/ipinfo_lite.mmdb

      - name: Build geoip files
        run: |
          go build -o geoip .
          ./geoip -c ./config.json

      - name: Verify mmdb files
        env:
          GEOIP_MMDB_FILE: ./output/Country.mmdb
        run: |
          go install github.com/maxmind/mmdbverify@v1.0.0
          "$(go env GOPATH)/bin/mmdbverify" -file "$GEOIP_MMDB_FILE"
          go test -v -count=1 -run '^TestReleaseDatabase$' .

      - name: Git push assets to "release" branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd output || exit 1
          git init -b release
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Country.mmdb
          git commit -m "$RELEASE_NAME"
          gh auth setup-git
          git remote add geoip "https://github.com/${GITHUB_REPOSITORY}.git"
          git push -f -u geoip release

      - name: Upload files to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG_NAME" ./output/Country.mmdb \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" --notes ""
